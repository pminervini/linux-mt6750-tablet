# /etc/systemd/system/getty@tty1.service.d/keep-boot-log.conf - with show-status.conf: do not
# wipe tty1 before the login prompt (Debian's TTYVTDisallocate=yes clears the screen and its
# scrollback, i.e. the boot status lines). mainline-default.service still repaints a clean prompt
# once the boot is marked healthy (60 s).
[Service]
TTYVTDisallocate=no
