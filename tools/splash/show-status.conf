# /etc/systemd/system.conf.d/show-status.conf - boot look "logo + scroll": the lk boot logo stays
# while the kernel boots quietly, then systemd's "[  OK  ] Started ..." lines scroll on tty1
# until the login prompt. Use with tablet-splash.service disabled (the animation keeps the
# console in graphics mode, which would hide these lines). Overrides the "quiet" default.
[Manager]
ShowStatus=yes
