# /etc/systemd/system.conf.d/watchdog.conf - systemd feeds the MT6755 hardware watchdog.
# The initramfs stops its busybox feeder before exec'ing systemd only if this file exists.
# 20 s (hardware maximum 31 s); systemd pings every 10 s. A hung PID 1 / kernel resets the board
# (full PMIC power cycle); within the first 60 s of a boot that lands in Android, later in mainline.
[Manager]
RuntimeWatchdogSec=20s
RebootWatchdogSec=10min
